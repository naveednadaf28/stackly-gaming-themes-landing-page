<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            background:#0b0b14;
            color:white;

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:20px;

        }

        .error-box{

            text-align:center;
            max-width:500px;

            animation:fadeUp 1s ease;

        }

        h1{

            font-size:100px;
            color:#8b5cf6;

            margin-bottom:10px;

        }

        h2{

            margin-bottom:15px;

        }

        p{

            color:#cbd5e1;

            line-height:1.7;
            margin-bottom:30px;

        }

        .btn{

            display:inline-block;

            padding:14px 28px;

            background:#8b5cf6;

            color:white;

            border-radius:8px;

            text-decoration:none;

            transition:.3s;

        }

        .btn:hover{

            transform:translateY(-4px);

        }

        @keyframes fadeUp{

            from{

                opacity:0;
                transform:translateY(40px);

            }

            to{

                opacity:1;
                transform:translateY(0);

            }

        }

    </style>

</head>

<body>

    <div class="error-box">

        <h1>404</h1>

        <h2>
            Game Over
        </h2>

        <p>

            Oops! The page you're looking for
            doesn't exist.

        </p>

        <a href="index.html" class="btn">

            Back To Home

        </a>

    </div>

</body>

</html>
